[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchrift"
version = "0.1.0"
description = "Multi-modal, sun-angle and scale-invariant image correspondence for Chandrayaan-2 optical imagery"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]